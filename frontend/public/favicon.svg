<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Logo A (Hriday, Stop 2, 25 Nov 2026): the ball off-centre in the gold range, on the slab at -6 degrees. -->
  <style>
    .s { fill: #2a303c; } .r { fill: #f2c14e; } .b { fill: #efede6; stroke: none; }
    @media (prefers-color-scheme: light) {
      .s { fill: #bfbaad; } .r { fill: #a86a00; } .b { fill: #ffffff; stroke: #14161b; stroke-width: 2.5px; }
    }
  </style>
  <g transform="rotate(-6 32 34)">
    <rect class="s" x="3" y="31" width="58" height="9" rx="4.5"/>
    <rect class="r" x="13" y="27" width="34" height="17" rx="8.5"/>
    <circle class="b" cx="37" cy="35.5" r="6"/>
  </g>
</svg>
